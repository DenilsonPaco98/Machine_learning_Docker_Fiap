stages:
  download_data:
    cmd: python src/ecommerce_ml/data_loader.py
    deps:
      - src/ecommerce_ml/data_loader.py
    outs:
      - data/raw/online_shoppers_intention.csv

  preprocess:
    cmd: python src/ecommerce_ml/preprocess.py
    deps:
      - data/raw/online_shoppers_intention.csv
      - src/ecommerce_ml/preprocess.py
    outs:
      - data/processed/train.csv
      - data/processed/test.csv

  train:
    cmd: python src/ecommerce_ml/train.py
    deps:
      - data/processed/train.csv
      - data/processed/test.csv
      - src/ecommerce_ml/train.py
    outs:
      - models/random_forest.joblib
