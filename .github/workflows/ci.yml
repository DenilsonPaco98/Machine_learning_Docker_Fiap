name: CI - Pytest

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      PYTHONPATH: src
      MLFLOW_TRACKING_URI: http://127.0.0.1:8080

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Poetry
        run: |
          python -m pip install --upgrade pip
          pip install poetry

      - name: Install dependencies
        run: |
          poetry install --with dev --no-interaction

      - name: Quick environment smoke check
        run: |
          poetry run python -c "import mlflow, sklearn, pandas; print('Environment OK')"

      - name: Run tests
        run: |
          poetry run pytest -q --maxfail=1 --disable-warnings --junitxml=pytest-report.xml

      - name: Upload pytest report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: pytest-report.xml
